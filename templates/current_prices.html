<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Gestão de Preços Atuais v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .select-group label {
            font-size: 12px;
            opacity: 0.9;
        }

        select, input[type="file"] {
            padding: 10px 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        select option {
            background: #667eea;
            color: white;
        }

        select:hover, input[type="file"]:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: white;
            color: #667eea;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-info {
            background: #3b82f6;
            color: white;
        }

        .btn-info:hover {
            background: #2563eb;
        }

        .btn-warning {
            background: #f59e0b;
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .content {
            padding: 30px;
        }

        .info-bar {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 18px;
            color: #111827;
            font-weight: 700;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f9fafb;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 12px 8px;
            text-align: center;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            white-space: nowrap;
        }

        th.grupo-col {
            position: sticky;
            left: 0;
            background: #f9fafb;
            z-index: 11;
            border-right: 2px solid #e5e7eb;
        }

        td {
            padding: 10px 8px;
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
        }

        td.grupo-cell {
            position: sticky;
            left: 0;
            background: white;
            font-weight: 700;
            color: #667eea;
            border-right: 2px solid #e5e7eb;
            z-index: 5;
        }

        tbody tr:hover {
            background: #f9fafb;
        }

        tbody tr:hover td.grupo-cell {
            background: #f3f4f6;
        }

        .price-cell {
            position: relative;
        }

        .price-input {
            width: 70px;
            padding: 6px 8px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .price-input:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }

        .price-input.net {
            background: #fff7ed;
            border-color: #fb923c;
        }

        .price-input.commission {
            background: #ecfdf5;
            border-color: #10b981;
        }

        .price-display {
            font-weight: 600;
            padding: 6px 8px;
        }

        .price-display.net {
            color: #ea580c;
        }

        .price-display.commission {
            color: #059669;
        }

        .day-header {
            background: #667eea;
            color: white;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
            z-index: 1000;
            min-width: 300px;
        }

        .toast.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }

        .toast.info {
            border-left: 4px solid #3b82f6;
        }

        .toast-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .toast-message {
            color: #6b7280;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-label {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .file-upload-label:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }

        .commission-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #667eea;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-input-group {
            margin-bottom: 15px;
        }

        .modal-input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #374151;
        }

        .modal-input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
        }

        .modal-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .period-info {
            background: #f0f4ff;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .period-info-label {
            font-size: 12px;
            color: #6b7280;
        }

        .period-info-value {
            font-weight: 700;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Gestão de Preços Atuais</h1>
            
            <div class="header-controls">
                <div class="select-group">
                    <label>Estação</label>
                    <select id="location">
                        <option value="Albufeira">Albufeira</option>
                        <option value="Faro">Aeroporto de Faro</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Mês</label>
                    <select id="month">
                        <option value="1">Janeiro</option>
                        <option value="2">Fevereiro</option>
                        <option value="3">Março</option>
                        <option value="4">Abril</option>
                        <option value="5">Maio</option>
                        <option value="6">Junho</option>
                        <option value="7">Julho</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Ano</label>
                    <select id="year">
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>

                <div class="select-group">
                    <label>Período</label>
                    <select id="period" onchange="loadSelectedPeriod()">
                        <option value="">Selecionar...</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="loadPeriods()">
                    🔄 Carregar
                </button>

                <button class="btn btn-success" onclick="showNewPeriodDialog()" style="background: #10b981; color: white;">
                    ➕ Novo Período
                </button>

                <label for="file-upload" class="file-upload-label">
                    📤 Upload Excel
                </label>
                <input type="file" id="file-upload" accept=".xlsx,.xls" onchange="uploadExcel(event)">

                <button class="btn btn-success" onclick="savePrices()">
                    💾 Guardar
                </button>

                <button class="btn btn-info" onclick="downloadAbbycar()">
                    📥 Abbycar
                </button>

                <button class="btn btn-info" onclick="downloadBrokers()">
                    📥 Brokers
                </button>

                <button class="btn btn-warning" onclick="downloadWebsite()">
                    📥 Website
                </button>
            </div>
        </div>

        <div class="content">
            <div class="info-bar">
                <div class="info-item">
                    <span class="info-label">Localização</span>
                    <span class="info-value" id="current-location">Albufeira</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Período</span>
                    <span class="info-value" id="current-period">Janeiro 2026</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Comissão</span>
                    <span class="commission-badge">13.66%</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Última Atualização</span>
                    <span class="info-value" id="last-update">-</span>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>A carregar preços...</p>
            </div>

            <div class="table-container" id="table-container" style="display: none;">
                <table id="prices-table">
                    <thead>
                        <tr id="header-row">
                            <th class="grupo-col">Grupo</th>
                        </tr>
                    </thead>
                    <tbody id="prices-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <div class="toast-title" id="toast-title"></div>
        <div class="toast-message" id="toast-message"></div>
    </div>

    <!-- Modal para Novo Período -->
    <div id="newPeriodModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">➕ Criar Novo Período</div>
            <div class="modal-body">
                <div class="modal-input-group">
                    <label>Dia Início</label>
                    <input type="number" id="newDayStart" min="1" max="31" value="1">
                </div>
                <div class="modal-input-group">
                    <label>Dia Fim</label>
                    <input type="number" id="newDayEnd" min="1" max="31" value="31">
                </div>
                <div style="font-size: 12px; color: #6b7280; margin-top: 10px;">
                    ℹ️ Pode criar até 4 períodos por mês
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeNewPeriodDialog()" style="background: #e5e7eb; color: #374151;">
                    Cancelar
                </button>
                <button class="btn btn-primary" onclick="createNewPeriod()">
                    Criar Período
                </button>
            </div>
        </div>
    </div>

    <script>
        const COMMISSION_RATE = 0.1366; // 13.66%
        const GRUPOS = ['B1', 'B2', 'BK1', 'BK2', 'C', 'D', 'DK', 'E1', 'E2', 'EK1', 'EK2', 'F', 'FK', 'G', 'J1', 'J2', 'L1', 'L2', 'M1', 'M2'];
        const DIAS = [1, 2, 3, 4, 5, 6, 7, 8, 9, 14, 22, 28, 31, 60];

        let currentPrices = {};
        let allPeriods = [];
        let currentPeriod = null;

        // Inicializar com mês e ano atuais
        window.onload = function() {
            const now = new Date();
            document.getElementById('month').value = now.getMonth() + 1;
            document.getElementById('year').value = now.getFullYear();
            loadPeriods();
        };

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-message').textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function calculateCommission(netPrice) {
            return Math.round((netPrice * (1 + COMMISSION_RATE)) * 100) / 100;
        }

        function updateInfoBar() {
            const location = document.getElementById('location').value;
            const month = document.getElementById('month').selectedOptions[0].text;
            const year = document.getElementById('year').value;
            
            document.getElementById('current-location').textContent = location;
            document.getElementById('current-period').textContent = `${month} ${year}`;
            document.getElementById('last-update').textContent = new Date().toLocaleString('pt-PT');
        }

        async function loadPeriods() {
            const location = document.getElementById('location').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('table-container').style.display = 'none';

            try {
                const response = await fetch(`/api/current-prices/load?location=${location}&month=${month}&year=${year}`);
                const data = await response.json();

                if (data.ok && data.periods && data.periods.length > 0) {
                    // Múltiplos períodos com dados
                    allPeriods = data.periods;
                    updatePeriodSelector();
                    loadPeriodByIndex(0);
                    showToast('Sucesso', `${allPeriods.length} período(s) carregado(s)!`);
                } else if (data.ok && data.prices) {
                    // Período único (compatibilidade)
                    allPeriods = [{
                        prices: data.prices,
                        updated_at: data.updated_at,
                        day_start: 1,
                        day_end: 31
                    }];
                    updatePeriodSelector();
                    loadPeriodByIndex(0);
                    showToast('Sucesso', 'Preços carregados!');
                } else {
                    // Sem preços - criar tabela vazia e permitir criar novo período
                    allPeriods = [];
                    updatePeriodSelector();
                    initializeEmptyPrices();
                    renderTable();
                    updateInfoBar();
                    showToast('Info', 'Sem preços guardados. Clique "➕ Novo Período" para criar.', 'info');
                    console.log('ℹ️ Sem preços guardados para esta localização/período');
                }
            } catch (error) {
                console.error('Erro ao carregar períodos:', error);
                allPeriods = [];
                updatePeriodSelector();
                initializeEmptyPrices();
                renderTable();
                updateInfoBar();
                showToast('Erro', 'Erro ao carregar períodos', 'error');
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('table-container').style.display = 'block';
        }

        function updatePeriodSelector() {
            const periodSelect = document.getElementById('period');
            periodSelect.innerHTML = '<option value="">Selecionar...</option>';
            
            allPeriods.forEach((period, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `Dias ${period.day_start}-${period.day_end}`;
                periodSelect.appendChild(option);
            });

            if (allPeriods.length === 0) {
                const option = document.createElement('option');
                option.value = 'new';
                option.textContent = '➕ Criar primeiro período';
                periodSelect.appendChild(option);
            }
        }

        function loadPeriodByIndex(index) {
            if (index >= 0 && index < allPeriods.length) {
                const period = allPeriods[index];
                currentPeriod = period;
                const rawPrices = period.prices || {};
                
                // Normalize prices: DB may store as simple numbers (36.42) 
                // but UI expects {net: 36.42, commission: 41.39}
                currentPrices = {};
                Object.keys(rawPrices).forEach(grupo => {
                    currentPrices[grupo] = {};
                    Object.keys(rawPrices[grupo] || {}).forEach(dia => {
                        const val = rawPrices[grupo][dia];
                        if (typeof val === 'number') {
                            // Simple number from DB → convert to {net, commission}
                            currentPrices[grupo][dia] = {
                                net: val,
                                commission: calculateCommission(val)
                            };
                        } else if (val && typeof val === 'object' && val.net !== undefined) {
                            // Already in correct format
                            currentPrices[grupo][dia] = val;
                        } else {
                            currentPrices[grupo][dia] = { net: 0, commission: 0 };
                        }
                    });
                });
                
                // DEBUG: Mostrar estrutura dos preços carregados
                console.log('🔍 [CURRENT-PRICES] Período carregado:', {
                    day_start: period.day_start,
                    day_end: period.day_end,
                    updated_at: period.updated_at
                });
                
                // Mostrar primeiros 2 grupos com seus dias e preços
                const grupos = Object.keys(currentPrices).slice(0, 2);
                grupos.forEach(grupo => {
                    console.log(`🔍 [CURRENT-PRICES] Grupo ${grupo}:`, currentPrices[grupo]);
                    const dias = Object.keys(currentPrices[grupo] || {});
                    console.log(`🔍 [CURRENT-PRICES]   Dias com preços: ${dias.join(', ')}`);
                    dias.slice(0, 3).forEach(dia => {
                        const priceData = currentPrices[grupo][dia];
                        console.log(`🔍 [CURRENT-PRICES]   Dia ${dia}: NET=${priceData?.net}, GROSS=${priceData?.commission}`);
                    });
                });
                
                document.getElementById('period').value = index;
                renderTable();
                updateInfoBar();
            }
        }

        function loadSelectedPeriod() {
            const periodSelect = document.getElementById('period');
            const value = periodSelect.value;
            
            if (value === 'new') {
                showNewPeriodDialog();
            } else if (value !== '') {
                loadPeriodByIndex(parseInt(value));
            }
        }

        function showNewPeriodDialog() {
            if (allPeriods.length >= 4) {
                showToast('Limite Atingido', 'Máximo de 4 períodos por mês', 'error');
                return;
            }
            document.getElementById('newPeriodModal').classList.add('show');
        }

        function closeNewPeriodDialog() {
            document.getElementById('newPeriodModal').classList.remove('show');
        }

        async function createNewPeriod() {
            const dayStart = parseInt(document.getElementById('newDayStart').value);
            const dayEnd = parseInt(document.getElementById('newDayEnd').value);
            const month = parseInt(document.getElementById('month').value);
            const year = parseInt(document.getElementById('year').value);

            // Get actual number of days in the selected month
            const daysInMonth = new Date(year, month, 0).getDate();

            if (dayStart < 1 || dayStart > daysInMonth) {
                showToast('Erro', `Dia início deve estar entre 1 e ${daysInMonth}`, 'error');
                return;
            }

            if (dayEnd < 1 || dayEnd > daysInMonth) {
                showToast('Erro', `Dia fim deve estar entre 1 e ${daysInMonth} (${daysInMonth} dias neste mês)`, 'error');
                return;
            }

            if (dayStart > dayEnd) {
                showToast('Erro', 'Dia início deve ser menor que dia fim', 'error');
                return;
            }

            // Criar período vazio
            initializeEmptyPrices();
            
            const location = document.getElementById('location').value;

            try {
                const response = await fetch('/api/current-prices/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        location,
                        month,
                        year,
                        day_start: dayStart,
                        day_end: dayEnd,
                        prices: currentPrices
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    closeNewPeriodDialog();
                    showToast('Sucesso', 'Novo período criado!');
                    loadPeriods(); // Recarregar todos os períodos
                } else {
                    showToast('Erro', data.error || 'Erro ao criar período', 'error');
                }
            } catch (error) {
                console.error('Erro ao criar período:', error);
                showToast('Erro', 'Erro ao criar período', 'error');
            }
        }

        function initializeEmptyPrices() {
            currentPrices = {};
            GRUPOS.forEach(grupo => {
                currentPrices[grupo] = {};
                DIAS.forEach(dia => {
                    currentPrices[grupo][dia] = {
                        net: 0,
                        commission: 0
                    };
                });
            });
        }

        function renderTable() {
            const headerRow = document.getElementById('header-row');
            const tbody = document.getElementById('prices-body');

            // Limpar
            headerRow.innerHTML = '<th class="grupo-col">Grupo</th>';
            tbody.innerHTML = '';

            // Criar cabeçalhos de dias
            DIAS.forEach(dia => {
                const th = document.createElement('th');
                th.className = 'day-header';
                th.colSpan = 2;
                th.textContent = `${dia} ${dia === 1 ? 'dia' : 'dias'}`;
                headerRow.appendChild(th);
            });

            // Criar sub-cabeçalhos (Net / Com Comissão)
            const subHeaderRow = document.createElement('tr');
            subHeaderRow.innerHTML = '<th class="grupo-col"></th>';
            DIAS.forEach(() => {
                subHeaderRow.innerHTML += '<th style="font-size: 11px; color: #ea580c;">Net</th>';
                subHeaderRow.innerHTML += '<th style="font-size: 11px; color: #059669;">Com Comissão</th>';
            });
            headerRow.parentElement.appendChild(subHeaderRow);

            // Criar linhas de grupos
            GRUPOS.forEach(grupo => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="grupo-cell">${grupo}</td>`;

                DIAS.forEach(dia => {
                    const prices = currentPrices[grupo]?.[dia] || { net: 0, commission: 0 };

                    // Célula Net
                    const tdNet = document.createElement('td');
                    tdNet.className = 'price-cell';
                    tdNet.innerHTML = `<input type="number" class="price-input net" 
                        value="${prices.net}" 
                        data-grupo="${grupo}" 
                        data-dia="${dia}" 
                        data-type="net"
                        onchange="updatePrice(this)"
                        step="0.01">`;
                    tr.appendChild(tdNet);

                    // Célula Com Comissão
                    const tdComm = document.createElement('td');
                    tdComm.className = 'price-cell';
                    tdComm.innerHTML = `<span class="price-display commission">${prices.commission.toFixed(2)}€</span>`;
                    tr.appendChild(tdComm);
                });

                tbody.appendChild(tr);
            });
        }

        function updatePrice(input) {
            const grupo = input.dataset.grupo;
            const dia = parseInt(input.dataset.dia);
            const netPrice = parseFloat(input.value) || 0;

            if (!currentPrices[grupo]) {
                currentPrices[grupo] = {};
            }

            const commissionPrice = calculateCommission(netPrice);

            currentPrices[grupo][dia] = {
                net: netPrice,
                commission: commissionPrice
            };

            // Atualizar display da comissão
            const row = input.closest('tr');
            const cells = row.querySelectorAll('.price-cell');
            const diaIndex = DIAS.indexOf(dia);
            const commCell = cells[diaIndex * 2 + 1];
            commCell.querySelector('.price-display').textContent = `${commissionPrice.toFixed(2)}€`;
        }

        async function savePrices() {
            console.log('[SAVE-DEBUG] savePrices called - version 2026-02-05-v2');
            const location = document.getElementById('location').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;

            // Obter day_start e day_end do período atual
            let dayStart = 1;
            let dayEnd = 31;
            
            if (currentPeriod) {
                dayStart = currentPeriod.day_start || 1;
                dayEnd = currentPeriod.day_end || 31;
            }
            
            console.log('[SAVE-DEBUG] Period:', dayStart, '-', dayEnd, '| currentPeriod:', currentPeriod);
            console.log('[SAVE-DEBUG] currentPrices sample:', JSON.stringify(currentPrices['B1'] || {}).substring(0, 200));

            try {
                // Convert {net, commission} format back to simple numbers for DB
                const pricesToSave = {};
                Object.keys(currentPrices).forEach(grupo => {
                    pricesToSave[grupo] = {};
                    Object.keys(currentPrices[grupo] || {}).forEach(dia => {
                        const val = currentPrices[grupo][dia];
                        if (typeof val === 'object' && val.net !== undefined) {
                            pricesToSave[grupo][dia] = val.net;
                        } else if (typeof val === 'number') {
                            pricesToSave[grupo][dia] = val;
                        }
                    });
                });
                
                console.log('[SAVE-DEBUG] pricesToSave sample:', JSON.stringify(pricesToSave['B1'] || {}).substring(0, 200));
                console.log('[SAVE-DEBUG] Sending to API:', { location, month, year, dayStart, dayEnd, groups: Object.keys(pricesToSave).length });
                
                const response = await fetch('/api/current-prices/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        location,
                        month: parseInt(month),
                        year: parseInt(year),
                        day_start: dayStart,
                        day_end: dayEnd,
                        prices: pricesToSave
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showToast('Sucesso', `Preços guardados (dias ${dayStart}-${dayEnd})!`);
                    updateInfoBar();
                    // Recarregar períodos e manter o período atual selecionado
                    const currentPeriodIndex = document.getElementById('period').value;
                    await loadPeriods();
                    if (currentPeriodIndex !== '') {
                        document.getElementById('period').value = currentPeriodIndex;
                        loadPeriodByIndex(parseInt(currentPeriodIndex));
                    }
                } else {
                    showToast('Erro', data.error || 'Erro ao guardar preços', 'error');
                }
            } catch (error) {
                console.error('Erro ao guardar preços:', error);
                showToast('Erro', 'Erro ao guardar preços', 'error');
            }
        }

        async function uploadExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            formData.append('location', document.getElementById('location').value);
            formData.append('month', document.getElementById('month').value);
            formData.append('year', document.getElementById('year').value);

            try {
                const response = await fetch('/api/current-prices/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.ok) {
                    currentPrices = data.prices;
                    renderTable();
                    showToast('Sucesso', 'Excel importado com sucesso!');
                } else {
                    showToast('Erro', data.error || 'Erro ao importar Excel', 'error');
                }
            } catch (error) {
                console.error('Erro ao fazer upload:', error);
                showToast('Erro', 'Erro ao fazer upload do Excel', 'error');
            }

            event.target.value = '';
        }

        async function downloadAbbycar() {
            await downloadFile('/api/current-prices/download/abbycar', 'Abbycar');
        }

        async function downloadBrokers() {
            await downloadFile('/api/current-prices/download/brokers', 'Brokers');
        }

        async function downloadWebsite() {
            await downloadFile('/api/current-prices/download/website', 'Website');
        }

        async function downloadFile(endpoint, type) {
            const location = document.getElementById('location').value;
            const month = document.getElementById('month').value;
            const year = document.getElementById('year').value;

            console.log(`[DOWNLOAD] ${type} - Location: ${location}, Month: ${month}, Year: ${year}`);
            console.log(`[DOWNLOAD] currentPrices keys:`, Object.keys(currentPrices));
            console.log(`[DOWNLOAD] Sample B1 prices:`, currentPrices.B1);
            console.log(`[DOWNLOAD] currentPeriod:`, currentPeriod);

            try {
                const response = await fetch(`${endpoint}?location=${location}&month=${month}&year=${year}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prices: currentPrices })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${type}-${location}-${month}-${year}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showToast('Sucesso', `Ficheiro ${type} descarregado!`);
                } else {
                    showToast('Erro', `Erro ao descarregar ficheiro ${type}`, 'error');
                }
            } catch (error) {
                console.error('Erro ao descarregar:', error);
                showToast('Erro', `Erro ao descarregar ficheiro ${type}`, 'error');
            }
        }
    </script>
