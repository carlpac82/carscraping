<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Comissões - CarScraping Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Esconder header quando em iframe
      if (window.location.search.includes("iframe=1")) {
        document.addEventListener('DOMContentLoaded', function() {
          const header = document.querySelector('header');
          if (header) header.style.display = 'none';
        });
      }
    </script>
</head>
<body class="bg-gray-50">
<div class="container">
    <h1>Gestão de Comissões</h1>
    
    <!-- Summary Cards -->
    <div class="summary-cards">
        <div class="summary-card">
            <h3>Total de Comissões Pagas</h3>
            <p class="summary-value" id="totalPaid">€0.00</p>
        </div>
        <div class="summary-card">
            <h3>Total de Comissões Por Pagar</h3>
            <p class="summary-value" id="totalUnpaid">€0.00</p>
        </div>
        <div class="summary-card">
            <h3>Reservas Pendentes</h3>
            <p class="summary-value" id="pendingBookings">0</p>
        </div>
        <div class="summary-card">
            <h3>Comissionistas Ativos</h3>
            <p class="summary-value" id="activeCommissioners">0</p>
        </div>
    </div>
    
    <!-- Filters -->
    <div class="filters-section">
        <div class="filter-group">
            <label>Status:</label>
            <select id="statusFilter">
                <option value="all">Todas</option>
                <option value="paid">Pagas</option>
                <option value="unpaid">Por Pagar</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Mês:</label>
            <select id="monthFilter">
                <option value="">Todos os Meses</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Comissionista:</label>
            <select id="commissionerFilter">
                <option value="">Todos</option>
            </select>
        </div>
        <button class="btn-primary" onclick="loadCommissions()">Atualizar</button>
    </div>
    
    <!-- Action Buttons -->
    <div class="action-buttons">
        <button class="btn-success" onclick="markSelectedPaid()" id="markPaidBtn" disabled>Marcar como Pagas</button>
        <button class="btn-warning" onclick="markSelectedUnpaid()" id="markUnpaidBtn" disabled>Marcar como Por Pagar</button>
        <div class="select-all-container">
            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()">
            <label for="selectAllCheckbox" id="selectAllText">Selecionar Todas</label>
        </div>
    </div>
    
    <!-- Commissions Table -->
    <div class="table-container">
        <table class="commissions-table">
            <thead>
                <tr>
                    <th></th>
                    <th>ID Reserva</th>
                    <th>Comissionista</th>
                    <th>Cliente</th>
                    <th>Data Reserva</th>
                    <th>Status</th>
                    <th>Valor Comissão</th>
                    <th>Status Pagamento</th>
                    <th>Data Pagamento</th>
                </tr>
            </thead>
            <tbody id="commissionsTableBody">
                <tr>
                    <td colspan="9">Carregando...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<style>
.summary-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.summary-card {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid #dee2e6;
}

.summary-card h3 {
    margin: 0 0 10px 0;
    font-size: 16px;
    color: #6c757d;
}

.summary-value {
    font-size: 24px;
    font-weight: bold;
    color: #495057;
    margin: 0;
}

.filters-section {
    background: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: flex;
    gap: 15px;
    align-items: end;
    flex-wrap: wrap;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.filter-group label {
    font-weight: 500;
    color: #495057;
}

.filter-group select {
    padding: 8px 12px;
    border: 1px solid #ced4da;
    border-radius: 4px;
    min-width: 150px;
}

.action-buttons {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.select-all-container {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

.btn-primary {
    background: #007bff;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
}

.btn-success {
    background: #28a745;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
}

.btn-warning {
    background: #ffc107;
    color: #212529;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
}

.btn-primary:hover, .btn-success:hover, .btn-warning:hover {
    opacity: 0.9;
}

.btn-primary:disabled, .btn-success:disabled, .btn-warning:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.table-container {
    overflow-x: auto;
}

.commissions-table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

.commissions-table th,
.commissions-table td {
    padding: 12px 8px;
    text-align: left;
    border-bottom: 1px solid #dee2e6;
}

.commissions-table th {
    background: #f8f9fa;
    font-weight: 600;
    color: #495057;
    position: sticky;
    top: 0;
}

.commissions-table tbody tr:hover {
    background: #f8f9fa;
}

.status-paid {
    color: #28a745;
    font-weight: 500;
}

.status-unpaid {
    color: #dc3545;
    font-weight: 500;
}

@media (max-width: 768px) {
    .filters-section {
        flex-direction: column;
        align-items: stretch;
    }
    
    .filter-group {
        flex-direction: row;
        justify-content: space-between;
    }
    
    .action-buttons {
        flex-direction: column;
        align-items: stretch;
    }
    
    .select-all-container {
        margin-left: 0;
        justify-content: center;
    }
    
    .commissions-table th,
    .commissions-table td {
        padding: 8px;
    }
}
</style>

<script>
let allCommissions = [];
let selectedCommissions = new Set();
let allSelected = false;

document.addEventListener('DOMContentLoaded', function() {
    loadSummary();
    loadCommissions();
    loadCommissioners();
    populateMonthFilter();
});

async function loadSummary() {
    try {
        const month = document.getElementById('monthFilter').value;
        const commissionerId = document.getElementById('commissionerFilter').value;
        
        let url = '/api/admin/commissions/summary';
        const params = new URLSearchParams();
        if (month) params.append('month', month);
        if (commissionerId) params.append('commissioner_id', commissionerId);
        if (params.toString()) url += '?' + params.toString();
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.ok) {
            document.getElementById('totalPaid').textContent = '€' + data.total_paid.toFixed(2);
            document.getElementById('totalUnpaid').textContent = '€' + data.total_unpaid.toFixed(2);
            document.getElementById('pendingBookings').textContent = data.pending_bookings;
            document.getElementById('activeCommissioners').textContent = data.active_commissioners;
        }
    } catch (error) {
        console.error('Error loading summary:', error);
    }
}

async function loadCommissions() {
    try {
        const status = document.getElementById('statusFilter').value;
        const month = document.getElementById('monthFilter').value;
        const commissionerId = document.getElementById('commissionerFilter').value;
        
        let url = '/api/admin/commissions/list';
        const params = new URLSearchParams();
        if (status !== 'all') params.append('status', status);
        if (month) params.append('month', month);
        if (commissionerId) params.append('commissioner_id', commissionerId);
        if (params.toString()) url += '?' + params.toString();
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.ok) {
            allCommissions = data.commissions;
            renderCommissionsTable();
        }
    } catch (error) {
        console.error('Error loading commissions:', error);
        document.getElementById('commissionsTableBody').innerHTML = '<tr><td colspan="9">Erro ao carregar dados</td></tr>';
    }
}

async function loadCommissioners() {
    try {
        const response = await fetch('/api/admin/commissioners');
        const data = await response.json();
        
        if (data.ok) {
            const select = document.getElementById('commissionerFilter');
            select.innerHTML = '<option value="">Todos</option>';
            
            data.commissioners.forEach(function(commissioner) {
                const option = document.createElement('option');
                option.value = commissioner.id;
                option.textContent = commissioner.name;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('Error loading commissioners:', error);
    }
}

function populateMonthFilter() {
    const select = document.getElementById('monthFilter');
    const currentDate = new Date();
    const currentYear = currentDate.getFullYear();
    
    for (let i = 0; i < 12; i++) {
        const date = new Date(currentYear, currentDate.getMonth() - i, 1);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 
                          'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const monthName = monthNames[date.getMonth()];
        
        const option = document.createElement('option');
        option.value = year + '-' + month;
        option.textContent = monthName.charAt(0).toUpperCase() + monthName.slice(1) + ' ' + year;
        select.appendChild(option);
    }
}

function renderCommissionsTable() {
    const tbody = document.getElementById('commissionsTableBody');
    
    if (allCommissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9">Nenhuma comissão encontrada</td></tr>';
        return;
    }
    
    let html = '';
    allCommissions.forEach(function(commission) {
        const statusClass = commission.commission_paid ? 'status-paid' : 'status-unpaid';
        const statusText = commission.commission_paid ? 'Paga' : 'Por Pagar';
        const paymentDate = commission.commission_paid_date ? 
            new Date(commission.commission_paid_date).toLocaleDateString('pt-PT') : '-';
        
        html += '<tr>' +
            '<td><input type="checkbox" value="' + commission.id + '" onchange="toggleSelection(' + commission.id + ')"></td>' +
            '<td>' + commission.id + '</td>' +
            '<td>' + (commission.commissioner_name || '-') + '</td>' +
            '<td>' + commission.client_name + '</td>' +
            '<td>' + new Date(commission.created_at).toLocaleDateString('pt-PT') + '</td>' +
            '<td>' + getStatusText(commission.status) + '</td>' +
            '<td>€' + commission.commission_amount.toFixed(2) + '</td>' +
            '<td><span class="' + statusClass + '">' + statusText + '</span></td>' +
            '<td>' + paymentDate + '</td>' +
        '</tr>';
    });
    
    tbody.innerHTML = html;
    updateSelectAllCheckbox();
}

function getStatusText(status) {
    const statusMap = {
        'pending': 'Pendente',
        'confirmed': 'Confirmada',
        'completed': 'Concluída',
        'cancelled': 'Cancelada'
    };
    return statusMap[status] || status;
}

function toggleSelection(commissionId) {
    if (selectedCommissions.has(commissionId)) {
        selectedCommissions.delete(commissionId);
    } else {
        selectedCommissions.add(commissionId);
    }
    updateActionButtons();
    updateSelectAllCheckbox();
}

function toggleSelectAll() {
    allSelected = !allSelected;
    const checkboxes = document.querySelectorAll('#commissionsTableBody input[type="checkbox"]');
    
    checkboxes.forEach(function(checkbox) {
        checkbox.checked = allSelected;
        const commissionId = parseInt(checkbox.value);
        if (allSelected) {
            selectedCommissions.add(commissionId);
        } else {
            selectedCommissions.delete(commissionId);
        }
    });
    
    document.getElementById('selectAllText').textContent = allSelected ? 'Desselecionar Todas' : 'Selecionar Todas';
    document.getElementById('selectAllCheckbox').checked = allSelected;
    updateActionButtons();
}

function updateSelectAllCheckbox() {
    const totalCheckboxes = document.querySelectorAll('#commissionsTableBody input[type="checkbox"]').length;
    const checkedCheckboxes = document.querySelectorAll('#commissionsTableBody input[type="checkbox"]:checked').length;
    
    document.getElementById('selectAllCheckbox').checked = totalCheckboxes > 0 && checkedCheckboxes === totalCheckboxes;
    document.getElementById('selectAllText').textContent = 
        (totalCheckboxes > 0 && checkedCheckboxes === totalCheckboxes) ? 'Desselecionar Todas' : 'Selecionar Todas';
}

function updateActionButtons() {
    const hasSelection = selectedCommissions.size > 0;
    document.getElementById('markPaidBtn').disabled = !hasSelection;
    document.getElementById('markUnpaidBtn').disabled = !hasSelection;
}

async function markSelectedPaid() {
    await markCommissions(true);
}

async function markSelectedUnpaid() {
    await markCommissions(false);
}

async function markCommissions(paid) {
    if (selectedCommissions.size === 0) return;
    
    const action = paid ? 'marcar como pagas' : 'marcar como por pagar';
    if (!confirm('Tem certeza que deseja ' + action + ' as comissões selecionadas?')) {
        return;
    }
    
    try {
        const response = await fetch('/api/admin/commissions/mark-paid', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                booking_ids: Array.from(selectedCommissions),
                paid: paid
            })
        });
        
        const data = await response.json();
        
        if (data.ok) {
            alert(data.message || 'Operação realizada com sucesso');
            selectedCommissions.clear();
            allSelected = false;
            loadCommissions();
            loadSummary();
            updateActionButtons();
        } else {
            alert('Erro: ' + (data.error || 'Ocorreu um erro'));
        }
    } catch (error) {
        console.error('Error marking commissions:', error);
        alert('Erro de conexão');
    }
}
</script>
</body>
</html>
