<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Comissionista | Auto Prudente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #009cb6 0%, #006d7e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo img {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
        }

        .logo h2 {
            color: #333;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .logo p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #009cb6;
            box-shadow: 0 0 0 3px rgba(0, 156, 182, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #009cb6 0%, #006d7e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 156, 182, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .info-message {
            background: #e3f2fd;
            color: #1565c0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }

        #emailForm {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="/static/logo_autoprudente 1.png" alt="Auto Prudente" onerror="this.style.display='none'">
            <h2>Portal de Comissionistas</h2>
            <p>Auto Prudente Rent a Car</p>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        <div id="infoMessage" class="info-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Utilizador</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
        </form>

        <form id="emailForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email" placeholder="seu.email@exemplo.com">
            </div>

            <button type="submit" class="btn-login" id="emailBtn">Guardar Email</button>
            <button type="button" class="btn-login" id="cancelBtn" style="background: #999; margin-top: 10px;">Cancelar</button>
        </form>

        <div class="footer">
            © 2026 Auto Prudente Rent a Car
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const emailForm = document.getElementById('emailForm');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const infoMessage = document.getElementById('infoMessage');
        const loginBtn = document.getElementById('loginBtn');
        const emailBtn = document.getElementById('emailBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        let currentCommissionerId = null;

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            infoMessage.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/commissioners/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.ok) {
                    if (data.needs_email) {
                        currentCommissionerId = data.commissioner_id;
                        infoMessage.textContent = 'Por favor, insira o seu email para continuar.';
                        infoMessage.style.display = 'block';
                        loginForm.style.display = 'none';
                        emailForm.style.display = 'block';
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Entrar';
                    } else {
                        successMessage.textContent = 'Login realizado com sucesso! Redirecionando...';
                        successMessage.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = '/agentes/dashboard';
                        }, 1000);
                    }
                } else {
                    errorMessage.textContent = data.error || 'Utilizador ou senha incorretos';
                    errorMessage.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Entrar';
                }
            } catch (error) {
                errorMessage.textContent = 'Erro de conexão. Tente novamente.';
                errorMessage.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Entrar';
            }
        });

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            infoMessage.style.display = 'none';
            emailBtn.disabled = true;
            emailBtn.textContent = 'Guardando...';

            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/api/commissioners/update-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ commissioner_id: currentCommissionerId, email })
                });

                const data = await response.json();

                if (data.ok) {
                    successMessage.textContent = 'Email guardado! Redirecionando...';
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/agentes/dashboard';
                    }, 1000);
                } else {
                    errorMessage.textContent = data.error || 'Erro ao guardar email';
                    errorMessage.style.display = 'block';
                    emailBtn.disabled = false;
                    emailBtn.textContent = 'Guardar Email';
                }
            } catch (error) {
                errorMessage.textContent = 'Erro de conexão. Tente novamente.';
                errorMessage.style.display = 'block';
                emailBtn.disabled = false;
                emailBtn.textContent = 'Guardar Email';
            }
        });

        cancelBtn.addEventListener('click', () => {
            loginForm.style.display = 'block';
            emailForm.style.display = 'none';
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            infoMessage.style.display = 'none';
            currentCommissionerId = null;
        });
    </script>
</body>
</html>
