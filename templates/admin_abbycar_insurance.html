    <script>
      function showAlert(message, type = 'success') {
        const alertContainer = document.getElementById('alertContainer');
        const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
        const iconPath = type === 'success' 
          ? 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z'
          : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
        
        alertContainer.innerHTML = `
          <div class="${alertClass} mb-4">
            <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}"/>
            </svg>
            <div>
              <p class="font-semibold">${message}</p>
            </div>
          </div>
        `;
        
        setTimeout(() => {
          alertContainer.innerHTML = '';
        }, 5000);
      }

      // Store raw pricing data globally
      let allPricingData = [];
      
      async function loadPricing() {
        try {
          const response = await fetch('/api/abbycar-insurance-pricing');
          const data = await response.json();
          
          if (data.ok) {
            allPricingData = data.data;
            applySortAndFilter();
          }
        } catch (error) {
          console.error('Error loading pricing:', error);
          showAlert('Erro ao carregar preços', 'error');
        }
      }
      
      function applySortAndFilter() {
        // Sort function for periods
        const getPeriodOrder = (period) => {
          const periodMap = {
            '1 day': 1,
            '2 days': 2,
            '3 days': 3,
            '4 days': 4,
            '5 days': 5,
            '6 days': 6,
            '7 days': 7,
            '8-10 days': 8,
            '11-12 days': 11,
            '13-14 days': 13,
            '15-21 days': 15,
            '22-28 days': 22
          };
          return periodMap[period] || 999;
        };
        
        // Sort data by period
        const sortedData = [...allPricingData].sort((a, b) => {
          return getPeriodOrder(a.period) - getPeriodOrder(b.period);
        });
        
        // Render all prices in unified view
        const allPricesList = document.getElementById('allPricesList');
        allPricesList.innerHTML = sortedData.length ? createGroupedPriceTable(sortedData) : '<p class="text-sm text-gray-500 italic">Nenhum preço configurado</p>';
      }
      
      function createGroupedPriceTable(prices) {
        const seasonNames = {
          'High': 'Alta',
          'Mid': 'Média',
          'Low': 'Baixa'
        };
        
        // Group by vehicle_group, season, and category to find same prices across periods
        const byVehicleSeasonCategory = {};
        prices.forEach(p => {
          const season = p.season || 'all';
          const key = `${p.vehicle_group}|${season}|${p.category}`;
          if (!byVehicleSeasonCategory[key]) {
            byVehicleSeasonCategory[key] = [];
          }
          byVehicleSeasonCategory[key].push(p);
        });
        
        // Group consecutive periods with same price
        const compactGroups = {};
        Object.keys(byVehicleSeasonCategory).forEach(key => {
          const [vehicle_group, season, category] = key.split('|');
          const items = byVehicleSeasonCategory[key];
          
          // Sort by period order
          const periodOrder = ['1 day', '2 days', '3 days', '4 days', '5 days', '6 days', '7 days', 
                              '8-10 days', '11-12 days', '13-14 days', '15-21 days', '22-28 days'];
          items.sort((a, b) => periodOrder.indexOf(a.period) - periodOrder.indexOf(b.period));
          
          // Group by price
          const priceGroups = {};
          items.forEach(item => {
            const price = item.insurance_price;
            if (!priceGroups[price]) {
              priceGroups[price] = [];
            }
            priceGroups[price].push(item);
          });
          
          // Create compact representation
          Object.keys(priceGroups).forEach(price => {
            const groupItems = priceGroups[price];
            const periods = groupItems.map(g => g.period);
            const periodDisplay = periods.length > 1 ? `${periods[0]} - ${periods[periods.length - 1]}` : periods[0];
            const ids = groupItems.map(g => g.id);
            
            const groupKey = `${vehicle_group}|${season}|${periodDisplay}`;
            if (!compactGroups[groupKey]) {
              compactGroups[groupKey] = {
                vehicle_group,
                season,
                period: periodDisplay,
                periods: periods,
                period_type: groupItems[0].period_type,
                categories: {},
                ids: {}
              };
            }
            compactGroups[groupKey].categories[category] = {
              insurance_price: parseFloat(price),
              id: ids[0],
              ids: ids
            };
            compactGroups[groupKey].ids[category] = ids;
          });
        });
        
        // Group by season
        const bySeasons = {
          'High': [],
          'Mid': [],
          'Low': [],
          'all': []
        };
        
        Object.values(compactGroups).forEach(group => {
          bySeasons[group.season].push(group);
        });
        
        // Sort by vehicle group order
        const vehicleGroupOrder = ['MDMV', 'MDMR', 'EDMV', 'MDAR', 'EDAV', 'CFMR', 'MTMR', 'CFMV', 'IWMR', 'CFAR', 'CGAR', 'SVMR', 'SVMD', 'SVAD', 'LVMD'];
        Object.keys(bySeasons).forEach(season => {
          bySeasons[season].sort((a, b) => {
            const aIndex = vehicleGroupOrder.indexOf(a.vehicle_group);
            const bIndex = vehicleGroupOrder.indexOf(b.vehicle_group);
            return (aIndex === -1 ? 999 : aIndex) - (bIndex === -1 ? 999 : bIndex);
          });
        });
        
        let html = '<div class="space-y-6">';
        
        // Render each season
        ['High', 'Mid', 'Low', 'all'].forEach(season => {
          if (bySeasons[season].length === 0) return;
          
          const seasonDisplay = season === 'all' ? 'Ano todo' : seasonNames[season];
          let seasonBadgeClass = 'bg-gray-100 text-gray-800';
          if (season === 'High') seasonBadgeClass = 'bg-red-100 text-red-800';
          else if (season === 'Mid') seasonBadgeClass = 'bg-yellow-100 text-yellow-800';
          else if (season === 'Low') seasonBadgeClass = 'bg-green-100 text-green-800';
          
          html += '<div class="border border-gray-200 rounded-lg overflow-hidden" data-season="' + season + '">';
          html += '<div class="bg-gray-50 px-4 py-3 border-b border-gray-200 flex items-center justify-between">';
          html += '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-semibold ' + seasonBadgeClass + '">' + seasonDisplay + '</span>';
          html += '<div class="flex gap-2">';
          html += '<button onclick="deleteAllPricesInSeason(\'' + season + '\')" class="text-xs px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition-colors">Eliminar Todos</button>';
          html += '</div>';
          html += '</div>';
          
          html += '<div class="overflow-x-auto">';
          html += '<table class="min-w-full divide-y divide-gray-200" id="table-' + season + '">';
          html += '<thead class="bg-white">';
          html += '<tr>';
          html += '<th onclick="sortTable(\'' + season + '\', \'grupo\')" class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase cursor-pointer hover:bg-gray-100">Grupo ↕</th>';
          html += '<th onclick="sortTable(\'' + season + '\', \'periodo\')" class="px-4 py-3 text-left text-xs font-semibold text-gray-700 uppercase cursor-pointer hover:bg-gray-100">Período ↕</th>';
          html += '<th class="px-4 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Comfort</th>';
          html += '<th class="px-4 py-3 text-center text-xs font-semibold text-gray-700 uppercase">Premium</th>';
          html += '</tr>';
          html += '</thead>';
          html += '<tbody class="bg-white divide-y divide-gray-200">';
          
          bySeasons[season].forEach((row, idx) => {
            let periodDisplay = row.period || '-';
            
            // Show individual periods if grouped
            if (row.periods && row.periods.length > 1) {
              const periodsText = row.periods.join(', ').replace(/ days/g, '').replace(/ day/g, '');
              periodDisplay = periodsText;
            }
            
            const rowClass = idx % 2 === 0 ? 'bg-white' : 'bg-gray-50';
            html += '<tr class="' + rowClass + ' hover:bg-blue-50">';
            html += '<td class="px-4 py-3 whitespace-nowrap"><span class="inline-flex items-center px-2.5 py-1 rounded text-xs font-semibold bg-[#009cb6] text-white">' + row.vehicle_group + '</span></td>';
            html += '<td class="px-4 py-3 text-sm font-medium text-gray-900">' + periodDisplay + '</td>';
            
            ['Comfort', 'Premium'].forEach(cat => {
              if (row.categories[cat]) {
                const p = row.categories[cat];
                const ids = p.ids || [p.id];
                const idsJson = JSON.stringify(ids).replace(/"/g, '&quot;');
                html += '<td class="px-4 py-3 whitespace-nowrap text-center">';
                html += '<div class="flex items-center justify-center gap-2">';
                html += '<span class="text-base font-bold text-[#009cb6]">€' + p.insurance_price.toFixed(2) + '</span>';
                html += '<button onclick=\'deleteMultiplePricing(' + idsJson + ', "' + row.vehicle_group + '", "' + cat + '")\' class="text-red-600 hover:text-red-900 p-1 rounded transition-colors" title="Eliminar ' + ids.length + ' período(s)">';
                html += '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>';
                html += '</button>';
                html += '</div>';
                html += '</td>';
              } else {
                html += '<td class="px-4 py-3 whitespace-nowrap text-center text-gray-400">-</td>';
              }
            });
            
            html += '</tr>';
          });
          
          html += '</tbody>';
          html += '</table>';
          html += '</div>';
          html += '</div>';
        });
        
        html += '</div>';
        
        return html;
      }
      
      async function deleteMultiple(ids, group, month) {
        if (!confirm('Eliminar ' + ids.length + ' preço(s) de ' + group + ' - ' + month + '?')) return;
        let success = 0, errors = 0;
        for (const id of ids) {
          try {
            const res = await fetch('/api/abbycar-insurance-pricing/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (data.ok) success++; else errors++;
          } catch (e) { errors++; }
        }
        if (success > 0) { showAlert(success + ' preço(s) eliminado(s)!', 'success'); loadPricing(); }
        if (errors > 0) showAlert(errors + ' erro(s)', 'error');
      }

      function createPriceRow(pricing) {
        const monthNames = {
          'January': 'Janeiro', 'February': 'Fevereiro', 'March': 'Março',
          'April': 'Abril', 'May': 'Maio', 'June': 'Junho',
          'July': 'Julho', 'August': 'Agosto', 'September': 'Setembro',
          'October': 'Outubro', 'November': 'Novembro', 'December': 'Dezembro'
        };
        
        const periodDisplay = pricing.period || 'Ano todo';
        const monthDisplay = pricing.seasonal_month ? (monthNames[pricing.seasonal_month] || pricing.seasonal_month) : 'Todos';
        const displayText = pricing.seasonal_month || pricing.period || 'Ano todo';
        
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-3 py-2 whitespace-nowrap">
              <input type="checkbox" class="price-checkbox rounded text-[#009cb6] focus:ring-[#009cb6]" data-id="${pricing.id}" data-group="${pricing.vehicle_group}">
            </td>
            <td class="px-3 py-2 whitespace-nowrap text-gray-800">${periodDisplay}</td>
            <td class="px-3 py-2 whitespace-nowrap text-gray-600">${monthDisplay}</td>
            <td class="px-3 py-2 whitespace-nowrap font-semibold text-gray-800">€${pricing.insurance_price.toFixed(2)}</td>
            <td class="px-3 py-2 whitespace-nowrap">
              <button onclick="deletePricing(${pricing.id}, '${pricing.vehicle_group}', '${displayText}')" class="text-red-500 hover:text-red-700 p-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </td>
          </tr>
        `;
      }

      async function deletePricing(id, group, period) {
        if (!confirm(`Tem certeza que deseja eliminar o preço para o grupo ${group} (${period})?`)) {
          return;
        }
        
        try {
          const response = await fetch(`/api/abbycar-insurance-pricing/${id}`, {
            method: 'DELETE'
          });
          const data = await response.json();
          
          if (data.ok) {
            showAlert(`Preço do grupo ${group} eliminado com sucesso!`, 'success');
            loadPricing();
          } else {
            showAlert(data.error || 'Erro ao eliminar preço', 'error');
          }
        } catch (error) {
          console.error('Error deleting pricing:', error);
          showAlert('Erro ao eliminar preço', 'error');
        }
      }
      
      async function deleteMultiplePricing(ids, group, category) {
        const count = ids.length;
        if (!confirm(`Tem certeza que deseja eliminar ${count} período(s) de ${group} - ${category}?`)) {
          return;
        }
        
        let success = 0;
        let errors = 0;
        
        try {
          for (const id of ids) {
            const response = await fetch(`/api/abbycar-insurance-pricing/${id}`, {
              method: 'DELETE'
            });
            const data = await response.json();
            
            if (data.ok) {
              success++;
            } else {
              errors++;
            }
          }
          
          if (success > 0) {
            showAlert(`${success} período(s) eliminado(s) com sucesso!`, 'success');
            loadPricing();
          }
          if (errors > 0) {
            showAlert(`${errors} erro(s) ao eliminar`, 'error');
          }
        } catch (error) {
          console.error('Error deleting multiple pricing:', error);
          showAlert('Erro ao eliminar preços', 'error');
        }
      }

      document.getElementById('insuranceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const category = document.getElementById('category').value;
        const insurancePrice = parseFloat(document.getElementById('insurancePrice').value);
        
        // Get selected vehicle groups from checkboxes
        const selectedGroups = Array.from(document.querySelectorAll('input[name="vehicleGroup"]:checked'))
          .map(cb => cb.value);
        
        // Get selected periods from checkboxes
        const selectedPeriods = Array.from(document.querySelectorAll('input[name="period"]:checked'))
          .map(cb => ({
            value: cb.value,
            type: cb.getAttribute('data-type')
          }));
        
        // Get selected seasons from checkboxes
        const selectedSeasons = Array.from(document.querySelectorAll('input[name="season"]:checked'))
          .map(cb => cb.value);
        
        if (selectedGroups.length === 0) {
          showAlert('Por favor, selecione pelo menos um grupo de veículo', 'error');
          return;
        }
        
        if (selectedPeriods.length === 0) {
          showAlert('Por favor, selecione pelo menos um período', 'error');
          return;
        }
        
        if (selectedSeasons.length === 0) {
          showAlert('Por favor, selecione pelo menos uma temporada', 'error');
          return;
        }
        
        if (isNaN(insurancePrice) || insurancePrice < 0) {
          showAlert('Por favor, insira um preço válido', 'error');
          return;
        }
        
        // Show loading indicator
        const submitBtn = document.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<svg class="animate-spin h-4 w-4 inline mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="3"></circle><path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" fill="currentColor"></path></svg>A guardar...';
        
        try {
          // Build array of all price entries to insert
          const prices = [];
          
          for (const vehicleGroup of selectedGroups) {
            for (const period of selectedPeriods) {
              // Create one entry for each selected season
              for (const season of selectedSeasons) {
                prices.push({
                  category,
                  vehicle_group: vehicleGroup,
                  period: period.value,
                  period_type: period.type,
                  season: season,
                  insurance_price: insurancePrice
                });
              }
            }
          }
          
          // Send all prices in one batch request
          const response = await fetch('/api/abbycar-insurance-pricing/batch', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ prices })
          });
          
          const data = await response.json();
          
          if (data.ok) {
            showAlert(`${data.success_count} preço(s) guardado(s) com sucesso!`, 'success');
            // Clear all checkboxes
            document.querySelectorAll('input[name="vehicleGroup"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[name="period"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[name="season"]').forEach(cb => cb.checked = false);
            document.getElementById('insurancePrice').value = '';
            loadPricing();
            
            if (data.error_count > 0) {
              console.warn(`${data.error_count} erro(s):`, data.errors);
            }
          } else {
            showAlert('Erro ao guardar preços: ' + data.error, 'error');
          }
        } catch (error) {
          console.error('Error saving pricing:', error);
          showAlert('Erro ao guardar preços', 'error');
        } finally {
          // Restore button state
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnText;
        }
      });

      // Select/Deselect all periods
      function selectAllPeriods() {
        document.querySelectorAll('input[name="period"]').forEach(cb => cb.checked = true);
      }
      
      function deselectAllPeriods() {
        document.querySelectorAll('input[name="period"]').forEach(cb => cb.checked = false);
      }
      
      // Select/Deselect all seasons
      function selectAllSeasons() {
        document.querySelectorAll('input[name="season"]').forEach(cb => cb.checked = true);
      }
      
      function deselectAllSeasons() {
        document.querySelectorAll('input[name="season"]').forEach(cb => cb.checked = false);
      }
      
      // Sort table by column
      let sortState = {};
      function sortTable(season, column) {
        const table = document.getElementById('table-' + season);
        const tbody = table.querySelector('tbody');
        const rows = Array.from(tbody.querySelectorAll('tr'));
        
        // Toggle sort direction
        const key = season + '-' + column;
        sortState[key] = sortState[key] === 'asc' ? 'desc' : 'asc';
        const direction = sortState[key];
        
        rows.sort((a, b) => {
          let aVal, bVal;
          
          if (column === 'grupo') {
            aVal = a.querySelector('td:nth-child(1)').textContent.trim();
            bVal = b.querySelector('td:nth-child(1)').textContent.trim();
          } else if (column === 'periodo') {
            aVal = a.querySelector('td:nth-child(2)').textContent.trim();
            bVal = b.querySelector('td:nth-child(2)').textContent.trim();
          }
          
          if (direction === 'asc') {
            return aVal.localeCompare(bVal);
          } else {
            return bVal.localeCompare(aVal);
          }
        });
        
        // Re-append rows in new order
        rows.forEach(row => tbody.appendChild(row));
      }
      
      // Delete all prices in a season
      async function deleteAllPricesInSeason(season) {
        // Collect all IDs from this season
        const allIds = [];
        allPricingData.forEach(p => {
          const pSeason = p.season || 'all';
          if (pSeason === season) {
            allIds.push(p.id);
          }
        });
        
        if (allIds.length === 0) {
          showAlert('Nenhum preço para eliminar', 'error');
          return;
        }
        
        const seasonNames = { 'High': 'Alta', 'Mid': 'Média', 'Low': 'Baixa', 'all': 'Ano todo' };
        const seasonDisplay = seasonNames[season] || season;
        
        if (!confirm(`Tem certeza que deseja eliminar TODOS os ${allIds.length} preço(s) da época ${seasonDisplay}?`)) {
          return;
        }
        
        let success = 0;
        let errors = 0;
        
        try {
          for (const id of allIds) {
            const response = await fetch(`/api/abbycar-insurance-pricing/${id}`, {
              method: 'DELETE'
            });
            const data = await response.json();
            
            if (data.ok) {
              success++;
            } else {
              errors++;
            }
          }
          
          if (success > 0) {
            showAlert(`${success} preço(s) eliminado(s) com sucesso!`, 'success');
            loadPricing();
          }
          if (errors > 0) {
            showAlert(`${errors} erro(s) ao eliminar`, 'error');
          }
        } catch (error) {
          console.error('Error deleting all prices:', error);
          showAlert('Erro ao eliminar preços', 'error');
        }
      }
      
      // Toggle all checkboxes in a table
      function toggleAllCheckboxes(headerCheckbox) {
        const checkboxes = document.querySelectorAll('.price-checkbox');
        checkboxes.forEach(cb => cb.checked = headerCheckbox.checked);
      }
      
      // Toggle all checkboxes in a group
      function toggleGroupCheckboxes(headerCheckbox, group) {
        const checkboxes = document.querySelectorAll(`.price-checkbox[data-group="${group}"]`);
        checkboxes.forEach(cb => cb.checked = headerCheckbox.checked);
      }
      
      // Delete selected prices
      async function deleteSelectedPrices() {
        const selectedCheckboxes = document.querySelectorAll('.price-checkbox:checked');
        
        if (selectedCheckboxes.length === 0) {
          showAlert('Por favor, selecione pelo menos um preço para eliminar', 'error');
          return;
        }
        
        if (!confirm(`Tem certeza que deseja eliminar ${selectedCheckboxes.length} preço(s) selecionado(s)?`)) {
          return;
        }
        
        let successCount = 0;
        let errorCount = 0;
        
        for (const checkbox of selectedCheckboxes) {
          const id = checkbox.getAttribute('data-id');
          
          try {
            const response = await fetch(`/api/abbycar-insurance-pricing/${id}`, {
              method: 'DELETE'
            });
            const data = await response.json();
            
            if (data.ok) {
              successCount++;
            } else {
              errorCount++;
            }
          } catch (error) {
            console.error('Error deleting pricing:', error);
            errorCount++;
          }
        }
        
        if (successCount > 0) {
          showAlert(`${successCount} preço(s) eliminado(s) com sucesso!`, 'success');
          loadPricing();
        }
        
        if (errorCount > 0) {
          showAlert(`${errorCount} erro(s) ao eliminar preços`, 'error');
        }
      }
      
      // Delete all prices in a category
      async function deleteAllInCategory(category) {
        if (!confirm(`Tem certeza que deseja eliminar TODOS os preços da categoria ${category}?`)) {
          return;
        }
        
        try {
          const response = await fetch('/api/abbycar-insurance-pricing');
          const data = await response.json();
          
          if (data.ok) {
            const categoryPrices = data.data.filter(p => p.category === category);
            
            if (categoryPrices.length === 0) {
              showAlert(`Nenhum preço encontrado na categoria ${category}`, 'error');
              return;
            }
            
            let successCount = 0;
            let errorCount = 0;
            
            for (const pricing of categoryPrices) {
              try {
                const deleteResponse = await fetch(`/api/abbycar-insurance-pricing/${pricing.id}`, {
                  method: 'DELETE'
                });
                const deleteData = await deleteResponse.json();
                
                if (deleteData.ok) {
                  successCount++;
                } else {
                  errorCount++;
                }
              } catch (error) {
                console.error('Error deleting pricing:', error);
                errorCount++;
              }
            }
            
            if (successCount > 0) {
              showAlert(`${successCount} preço(s) da categoria ${category} eliminado(s) com sucesso!`, 'success');
              loadPricing();
            }
            
            if (errorCount > 0) {
              showAlert(`${errorCount} erro(s) ao eliminar preços`, 'error');
            }
          }
        } catch (error) {
          console.error('Error loading pricing:', error);
          showAlert('Erro ao carregar preços', 'error');
        }
      }
      
      // Import Excel file
      async function importExcel(event) {
        const file = event.target.files[0];
        
        if (!file) {
          return;
        }
        
        if (!confirm('Importar preços do Excel?\n\nNOTA: Os preços existentes serão atualizados/substituídos pelos valores do ficheiro.')) {
          event.target.value = '';
          return;
        }
        
        if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
          showAlert('Por favor, selecione um ficheiro Excel (.xlsx ou .xls)', 'error');
          return;
        }
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
          showAlert('A importar ficheiro...', 'success');
          
          const response = await fetch('/api/abbycar-insurance-pricing/import', {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          
          if (data.ok) {
            let message = `${data.success_count} preço(s) importado(s) com sucesso!`;
            if (data.error_count > 0) {
              message += ` ${data.error_count} erro(s).`;
              if (data.errors && data.errors.length > 0) {
                console.error('Import errors:', data.errors);
              }
            }
            showAlert(message, data.error_count > 0 ? 'error' : 'success');
            loadPricing();
          } else {
            showAlert(data.error || 'Erro ao importar ficheiro', 'error');
          }
        } catch (error) {
          console.error('Error importing file:', error);
          showAlert('Erro ao importar ficheiro', 'error');
        } finally {
          // Reset file input
          event.target.value = '';
        }
      }

      loadPricing();
    </script>
