<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeador de Campos PDF - Livro de Reservas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f9fafb;
            padding: 20px;
        }
        .mapper-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 100%;
        }
        .pdf-viewer {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
        }
        .controls {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }
        canvas {
            width: 100%;
            cursor: crosshair;
            border: 1px solid #d1d5db;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background: #009cb6;
            color: white;
        }
        .btn-primary:hover {
            background: #008299;
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .field-selector {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .current-field {
            background: #f0f9fb;
            border: 2px solid #009cb6;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
        }
        .current-field h3 {
            color: #009cb6;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .coordinates-display {
            background: #f9fafb;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
        }
        .page-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .page-info {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: #f9fafb;
            border-radius: 6px;
            font-weight: 500;
        }
        .mapped-fields {
            margin-top: 20px;
        }
        .mapped-fields h4 {
            margin-bottom: 10px;
            color: #374151;
        }
        .mapped-field-item {
            padding: 8px;
            background: #f9fafb;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mapped-field-item.mapped {
            background: #d1fae5;
            border-left: 3px solid #10b981;
        }
        .field-label {
            font-weight: 500;
            color: #374151;
        }
        .field-coords {
            font-family: monospace;
            font-size: 11px;
            color: #6b7280;
        }
        .success-message {
            background: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="mapper-container">
        <div class="pdf-viewer">
            <h2 style="margin-bottom: 15px; color: #111827;">Livro de Reservas - Mapeamento de Campos</h2>
            
            <div class="page-controls">
                <button class="btn btn-secondary" onclick="previousPage()" id="prevBtn">← Anterior</button>
                <div class="page-info" id="pageInfo">Página 1 de 1</div>
                <button class="btn btn-secondary" onclick="nextPage()" id="nextBtn">Próxima →</button>
            </div>
            
            <canvas id="pdfCanvas"></canvas>
        </div>
        
        <div class="controls">
            <h3 style="margin-bottom: 15px; color: #111827;">Controles de Mapeamento</h3>
            
            <div class="success-message" id="successMessage"></div>
            <div class="error-message" id="errorMessage"></div>
            
            <div class="current-field">
                <h3 id="currentFieldName">Selecione um campo</h3>
                <p style="color: #6b7280; font-size: 12px; margin-top: 5px;" id="currentFieldDesc"></p>
                <div class="coordinates-display" id="coordsDisplay">
                    Clique no PDF para definir coordenadas
                </div>
            </div>
            
            <label style="display: block; margin-bottom: 5px; font-weight: 500; color: #374151;">Selecionar Campo:</label>
            <select class="field-selector" id="fieldSelector" onchange="updateCurrentField()">
                <option value="">-- Selecione um campo --</option>
                <optgroup label="Informações do Voucher">
                    <option value="voucher_number">Número do Voucher</option>
                    <option value="created_date">Data de Criação</option>
                </optgroup>
                <optgroup label="Dados do Cliente">
                    <option value="client_name">Nome do Cliente</option>
                    <option value="client_email">Email do Cliente</option>
                    <option value="client_phone">Telefone do Cliente</option>
                    <option value="client_hotel">Hotel</option>
                    <option value="client_room">Número do Quarto</option>
                    <option value="flight_number">Número do Voo</option>
                </optgroup>
                <optgroup label="Datas e Locais">
                    <option value="pickup_date">Data de Levantamento</option>
                    <option value="pickup_time">Hora de Levantamento</option>
                    <option value="pickup_location">Local de Levantamento</option>
                    <option value="dropoff_date">Data de Entrega</option>
                    <option value="dropoff_time">Hora de Entrega</option>
                    <option value="dropoff_location">Local de Entrega</option>
                </optgroup>
                <optgroup label="Veículo">
                    <option value="vehicle_group">Grupo do Veículo</option>
                    <option value="vehicle_name">Nome do Veículo</option>
                </optgroup>
                <optgroup label="Preços">
                    <option value="base_price">Preço Base</option>
                    <option value="insurance_price">Seguro Premium</option>
                    <option value="road_tax">Road Tax</option>
                    <option value="total_price">Preço Total</option>
                </optgroup>
                <optgroup label="Extras e Observações">
                    <option value="extras">Extras (GPS, Cadeira, etc)</option>
                    <option value="observations">Observações</option>
                </optgroup>
                <optgroup label="Comissionista">
                    <option value="commissioner_name">Nome do Comissionista</option>
                </optgroup>
            </select>
            
            <button class="btn btn-primary" onclick="saveCurrentField()">💾 Guardar Campo Atual</button>
            <button class="btn btn-secondary" onclick="saveAllFields()">💾 Guardar Todos os Campos</button>
            <button class="btn btn-danger" onclick="clearCurrentField()">🗑️ Limpar Campo Atual</button>
            
            <div class="mapped-fields">
                <h4>Campos Mapeados:</h4>
                <div id="mappedFieldsList"></div>
            </div>
        </div>
    </div>

    <script>
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.5;
        let canvas = document.getElementById('pdfCanvas');
        let ctx = canvas.getContext('2d');
        let coordinates = {};
        let currentCoords = null;

        // Carregar PDF
        async function loadPDF() {
            try {
                const response = await fetch('/api/commissioner-booking-pdf/get-template');
                const data = await response.json();
                
                if (!data.ok) {
                    showError('Erro ao carregar PDF: ' + data.error);
                    return;
                }
                
                const pdfData = atob(data.pdf_data);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                pdfDoc = await loadingTask.promise;
                
                document.getElementById('pageInfo').textContent = `Página ${pageNum} de ${pdfDoc.numPages}`;
                renderPage(pageNum);
                loadCoordinates();
            } catch (error) {
                console.error('Error loading PDF:', error);
                showError('Erro ao carregar PDF: ' + error.message);
            }
        }

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({scale: scale});
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);
                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                    drawAllCoordinates();
                });
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function previousPage() {
            if (pageNum <= 1) return;
            pageNum--;
            document.getElementById('pageInfo').textContent = `Página ${pageNum} de ${pdfDoc.numPages}`;
            queueRenderPage(pageNum);
        }

        function nextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            document.getElementById('pageInfo').textContent = `Página ${pageNum} de ${pdfDoc.numPages}`;
            queueRenderPage(pageNum);
        }

        // Click no canvas para definir coordenadas
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            const fieldId = document.getElementById('fieldSelector').value;
            if (!fieldId) {
                showError('Selecione um campo primeiro');
                return;
            }
            
            currentCoords = {
                x: x / scale,
                y: y / scale,
                page: pageNum
            };
            
            coordinates[fieldId] = currentCoords;
            
            document.getElementById('coordsDisplay').innerHTML = `
                X: ${currentCoords.x.toFixed(2)}<br>
                Y: ${currentCoords.y.toFixed(2)}<br>
                Página: ${currentCoords.page}
            `;
            
            drawAllCoordinates();
            updateMappedFieldsList();
        });

        function drawAllCoordinates() {
            // Redesenhar a página
            queueRenderPage(pageNum);
            
            // Desenhar marcadores para coordenadas da página atual
            setTimeout(() => {
                Object.keys(coordinates).forEach(fieldId => {
                    const coord = coordinates[fieldId];
                    if (coord && coord.page === pageNum) {
                        ctx.fillStyle = 'rgba(0, 156, 182, 0.3)';
                        ctx.fillRect(coord.x * scale - 5, coord.y * scale - 5, 10, 10);
                        ctx.strokeStyle = '#009cb6';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(coord.x * scale - 5, coord.y * scale - 5, 10, 10);
                    }
                });
            }, 100);
        }

        async function loadCoordinates() {
            try {
                const response = await fetch('/api/commissioner-booking-pdf/get-coordinates');
                const data = await response.json();
                
                if (data.ok && data.coordinates) {
                    data.coordinates.forEach(coord => {
                        coordinates[coord.field_id] = {
                            x: coord.x,
                            y: coord.y,
                            page: coord.page || 1
                        };
                    });
                    updateMappedFieldsList();
                    drawAllCoordinates();
                }
            } catch (error) {
                console.error('Error loading coordinates:', error);
            }
        }

        async function saveCurrentField() {
            const fieldId = document.getElementById('fieldSelector').value;
            if (!fieldId) {
                showError('Selecione um campo');
                return;
            }
            
            if (!coordinates[fieldId]) {
                showError('Clique no PDF para definir as coordenadas primeiro');
                return;
            }
            
            try {
                const response = await fetch('/api/commissioner-booking-pdf/save-coordinate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        field_id: fieldId,
                        x: coordinates[fieldId].x,
                        y: coordinates[fieldId].y,
                        page: coordinates[fieldId].page
                    })
                });
                
                const data = await response.json();
                if (data.ok) {
                    showSuccess('Campo guardado com sucesso!');
                    updateMappedFieldsList();
                } else {
                    showError('Erro ao guardar: ' + data.error);
                }
            } catch (error) {
                showError('Erro ao guardar: ' + error.message);
            }
        }

        async function saveAllFields() {
            const coordsArray = Object.keys(coordinates).map(fieldId => ({
                field_id: fieldId,
                x: coordinates[fieldId].x,
                y: coordinates[fieldId].y,
                page: coordinates[fieldId].page
            }));
            
            if (coordsArray.length === 0) {
                showError('Nenhum campo para guardar');
                return;
            }
            
            try {
                const response = await fetch('/api/commissioner-booking-pdf/save-coordinates', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({coordinates: coordsArray})
                });
                
                const data = await response.json();
                if (data.ok) {
                    showSuccess(`${coordsArray.length} campos guardados com sucesso!`);
                } else {
                    showError('Erro ao guardar: ' + data.error);
                }
            } catch (error) {
                showError('Erro ao guardar: ' + error.message);
            }
        }

        function clearCurrentField() {
            const fieldId = document.getElementById('fieldSelector').value;
            if (!fieldId) {
                showError('Selecione um campo');
                return;
            }
            
            delete coordinates[fieldId];
            currentCoords = null;
            document.getElementById('coordsDisplay').innerHTML = 'Clique no PDF para definir coordenadas';
            updateMappedFieldsList();
            drawAllCoordinates();
        }

        function updateCurrentField() {
            const fieldId = document.getElementById('fieldSelector').value;
            const fieldName = document.getElementById('fieldSelector').selectedOptions[0]?.text || 'Selecione um campo';
            
            document.getElementById('currentFieldName').textContent = fieldName;
            
            if (coordinates[fieldId]) {
                document.getElementById('coordsDisplay').innerHTML = `
                    X: ${coordinates[fieldId].x.toFixed(2)}<br>
                    Y: ${coordinates[fieldId].y.toFixed(2)}<br>
                    Página: ${coordinates[fieldId].page}
                `;
            } else {
                document.getElementById('coordsDisplay').innerHTML = 'Clique no PDF para definir coordenadas';
            }
        }

        function updateMappedFieldsList() {
            const list = document.getElementById('mappedFieldsList');
            const selector = document.getElementById('fieldSelector');
            
            list.innerHTML = '';
            
            Array.from(selector.options).forEach(option => {
                if (option.value) {
                    const isMapped = coordinates[option.value];
                    const item = document.createElement('div');
                    item.className = 'mapped-field-item' + (isMapped ? ' mapped' : '');
                    item.innerHTML = `
                        <span class="field-label">${option.text}</span>
                        ${isMapped ? '<span class="field-coords">✓ Mapeado</span>' : '<span class="field-coords">Pendente</span>'}
                    `;
                    list.appendChild(item);
                }
            });
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            loadPDF();
            updateCurrentField();
            updateMappedFieldsList();
        });
    </script>
</body>
</html>
