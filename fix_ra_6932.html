<!DOCTYPE html>
<html>
<head>
    <title>Fix RA 6932</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        pre {
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Fix RA 6932 - Copy Inspection from AS-78-RH to AT-28-NX</h1>
    
    <p>Este script vai criar uma inspeção de check-in para a viatura AT-28-NX copiando os dados da AS-78-RH.</p>
    
    <button class="button" id="fixButton" onclick="fixRA6932()">Corrigir RA 6932</button>
    
    <div id="result"></div>

    <script>
        async function fixRA6932() {
            const button = document.getElementById('fixButton');
            const resultDiv = document.getElementById('result');
            
            button.disabled = true;
            button.textContent = 'A processar...';
            resultDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/admin/fix-ra-6932', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                resultDiv.style.display = 'block';
                
                if (data.success) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3>✅ Sucesso!</h3>
                        <p>${data.message}</p>
                        <h4>Detalhes:</h4>
                        <pre>${JSON.stringify(data.details, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `
                        <h3>⚠️ Aviso</h3>
                        <p>${data.message || data.error}</p>
                    `;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'error';
                resultDiv.innerHTML = `
                    <h3>❌ Erro</h3>
                    <p>${error.message}</p>
                `;
            } finally {
                button.disabled = false;
                button.textContent = 'Corrigir RA 6932';
            }
        }
    </script>
</body>
</html>
