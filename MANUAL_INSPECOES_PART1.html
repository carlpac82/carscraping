<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Inspeções - Auto Prudente</title>
    <style>
        @page { size: A4; margin: 0; }
        @media print {
            .page-break { page-break-after: always; }
            body { margin: 0; }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #009cb6 0%, #007a94 100%);
            color: white;
            padding: 50px 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header img {
            position: absolute;
            left: 40px;
            height: 70px;
        }
        .header-content {
            text-align: center;
        }
        .header h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 20px;
            opacity: 0.95;
        }
        .content {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 40px;
        }
        h2 {
            color: #009cb6;
            font-size: 32px;
            margin-bottom: 25px;
            border-bottom: 4px solid #009cb6;
            padding-bottom: 12px;
        }
        h3 {
            color: #007a94;
            font-size: 24px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        h4 {
            color: #555;
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        p {
            margin-bottom: 15px;
            text-align: justify;
            font-size: 16px;
        }
        ul, ol {
            margin-left: 30px;
            margin-bottom: 20px;
        }
        li {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .step {
            background: #f8f9fa;
            border-left: 5px solid #009cb6;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }
        .step-number {
            display: inline-block;
            background: #009cb6;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            text-align: center;
            line-height: 35px;
            font-weight: bold;
            margin-right: 12px;
            font-size: 18px;
        }
        .warning {
            background: #fff3cd;
            border-left: 5px solid #ffc107;
            padding: 18px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        .info {
            background: #d1ecf1;
            border-left: 5px solid #0dcaf0;
            padding: 18px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        .success {
            background: #d1e7dd;
            border-left: 5px solid #198754;
            padding: 18px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 16px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 14px;
            text-align: left;
        }
        th {
            background: #009cb6;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: #f8f9fa;
        }
        .footer {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            color: #666;
            font-size: 15px;
            margin-top: 50px;
            border-top: 3px solid #009cb6;
        }
        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="static/ap-heather.png" alt="Auto Prudente">
        <div class="header-content">
            <h1>Manual de Inspeções de Veículos</h1>
            <p>Sistema Completo de Check-in e Check-out</p>
        </div>
    </div>
